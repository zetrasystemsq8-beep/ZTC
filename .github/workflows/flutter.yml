name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create Android Project (only if missing)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Generate Splash Screen
        run: |
          if grep -q "flutter_native_splash" pubspec.yaml; then
            dart run flutter_native_splash:create
          fi

      - name: Analyze
        run: flutter analyze || true

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ztc-bank-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # ADDED: Public APK download link
      - name: Publish Public APK Download
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ztc-latest
          name: ZTC Bank Latest
          body: |
            Download the latest ZTC Bank APK below.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
          prerelease: false
          overwrite_files: true
